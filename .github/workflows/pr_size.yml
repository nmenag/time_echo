name: PR Size

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  size:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR size
        uses: github/size-limit@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIZE_LIMIT: 500
